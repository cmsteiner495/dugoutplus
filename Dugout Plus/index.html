<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dugout — Team Comms MVP</title>
  <style>
    :root{
      --bg: #0b1020;
      --panel: #101a33;
      --panel2:#0f1730;
      --text:#e9eefc;
      --muted:#a8b4d6;
      --line: rgba(255,255,255,.10);
      --brand:#7aa7ff;
      --good:#5be7a1;
      --warn:#ffcf5a;
      --bad:#ff6b6b;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 700px at 50% -20%, rgba(122,167,255,.20), transparent 55%),
                  radial-gradient(900px 600px at 80% 10%, rgba(91,231,161,.12), transparent 50%),
                  var(--bg);
      color:var(--text);
    }
    a{ color:inherit; text-decoration:none; }
    button{ font:inherit; }
    .app{
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display:flex;
      flex-direction:column;
      padding-bottom: 88px; /* for tab bar */
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,16,32,.92), rgba(11,16,32,.65));
      border-bottom: 1px solid var(--line);
      padding: 14px 16px 12px;
    }
    .toprow{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .brand{
      display:flex; flex-direction:column; gap:2px;
    }
    .brand h1{
      margin:0;
      font-size:16px;
      letter-spacing:.3px;
      display:flex; align-items:center; gap:8px;
    }
    .pill{
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      background: rgba(122,167,255,.14);
      border: 1px solid rgba(122,167,255,.25);
      color: var(--text);
      white-space:nowrap;
    }
    .sub{
      font-size:12px;
      color: var(--muted);
    }
    .roleRow{
      display:flex; gap:8px; align-items:center; justify-content:flex-end;
    }
    select{
      width: 150px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      outline:none;
    }

    main{ padding: 14px 16px; flex:1; }
    .card{
      background: linear-gradient(180deg, rgba(16,26,51,.92), rgba(15,23,48,.92));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .stack{ display:flex; flex-direction:column; gap:12px; }
    .row{ display:flex; gap:10px; align-items:center; }
    .between{ justify-content:space-between; }
    .muted{ color:var(--muted); }
    .tiny{ font-size:12px; }
    .btn{
      border:none;
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(255,255,255,.08);
      color: var(--text);
      border: 1px solid var(--line);
      cursor:pointer;
    }
    .btn.primary{
      background: rgba(122,167,255,.18);
      border: 1px solid rgba(122,167,255,.32);
    }
    .btn.good{
      background: rgba(91,231,161,.14);
      border: 1px solid rgba(91,231,161,.28);
    }
    .btn.bad{
      background: rgba(255,107,107,.14);
      border: 1px solid rgba(255,107,107,.28);
    }
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }
    .chip{
      font-size:12px;
      padding: 4px 10px;
      border-radius:999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
    }
    .chip.tag{
      border-color: rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
    }
    .chip.pin{
      border-color: rgba(255,207,90,.30);
      background: rgba(255,207,90,.12);
      color: var(--text);
    }
    .chip.official{
      border-color: rgba(122,167,255,.35);
      background: rgba(122,167,255,.14);
    }

    /* Tabs */
    .tabbar{
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display:flex;
      justify-content:center;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(11,16,32,.96), rgba(11,16,32,.68));
      border-top: 1px solid var(--line);
      z-index: 20;
    }
    .tabs{
      width: min(520px, 100%);
      display:flex;
      gap:10px;
      justify-content:space-between;
      padding: 0 10px;
    }
    .tab{
      flex:1;
      text-align:center;
      padding: 10px 8px;
      border-radius: 16px;
      border: 1px solid transparent;
      color: var(--muted);
      cursor:pointer;
      user-select:none;
      font-size:12px;
    }
    .tab.active{
      color: var(--text);
      background: rgba(255,255,255,.06);
      border-color: var(--line);
    }
    .icon{
      display:block;
      font-size:16px;
      margin-bottom:4px;
    }

    /* Lists */
    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
    }
    .title{
      font-size:14px;
      font-weight:650;
      margin:0 0 4px;
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    }
    .meta{
      display:flex; gap:10px; flex-wrap:wrap;
      color: var(--muted);
      font-size:12px;
    }
    .divider{
      height:1px; background: var(--line); margin: 10px 0;
    }

    /* Chat layout */
    .channels{
      display:flex;
      gap:10px;
      overflow:auto;
      padding-bottom: 2px;
    }
    .chan{
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      white-space:nowrap;
      cursor:pointer;
      user-select:none;
    }
    .chan.active{
      color: var(--text);
      background: rgba(122,167,255,.14);
      border-color: rgba(122,167,255,.28);
    }
    .composer{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 10px;
    }
    textarea, input[type="text"]{
      width:100%;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      outline:none;
    }
    textarea{ min-height: 86px; resize:none; }
    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .toggle{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      font-size:13px;
      color: var(--text);
    }
    .toggle input{ transform: scale(1.1); }

    /* Thread drawer */
    .drawerBackdrop{
      position: fixed; inset:0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      z-index: 50;
      display:none;
      align-items:flex-end;
      justify-content:center;
    }
    .drawerBackdrop.show{ display:flex; }
    .drawer{
      width: min(520px, 100%);
      max-height: 82vh;
      background: linear-gradient(180deg, rgba(16,26,51,.98), rgba(15,23,48,.98));
      border: 1px solid var(--line);
      border-bottom: none;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      box-shadow: 0 -20px 50px rgba(0,0,0,.45);
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      overflow:auto;
    }
    .drawerHeader{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      position: sticky; top:0;
      background: linear-gradient(to bottom, rgba(16,26,51,.98), rgba(16,26,51,.80));
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .drawerHeader h3{ margin:0; font-size:14px; }
    .replyRow{
      display:flex; gap:10px; margin-top:10px;
    }
    .replyRow input{ flex:1; }
    .badge{
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(0,0,0,.10);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="toprow">
        <div class="brand">
          <h1>⚾ Dugout <span class="pill" id="teamNamePill">Raptors 10U</span></h1>
          <div class="sub">Structured comms: Official updates never get buried.</div>
        </div>
        <div class="roleRow">
          <select id="roleSelect" aria-label="Role select">
            <option value="coach">Coach</option>
            <option value="staff">Staff</option>
            <option value="parent" selected>Parent</option>
          </select>
        </div>
      </div>
    </header>

    <main id="main"></main>

    <div class="tabbar">
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="home"><span class="icon">🏠</span>Home</div>
        <div class="tab" data-tab="schedule"><span class="icon">📅</span>Schedule</div>
        <div class="tab" data-tab="chat"><span class="icon">💬</span>Chat</div>
        <div class="tab" data-tab="roster"><span class="icon">👥</span>Roster</div>
        <div class="tab" data-tab="more"><span class="icon">⚙️</span>More</div>
      </div>
    </div>
  </div>

  <!-- Thread Drawer -->
  <div class="drawerBackdrop" id="drawerBackdrop" role="dialog" aria-modal="true" aria-label="Thread drawer">
    <div class="drawer">
      <div class="drawerHeader">
        <h3 id="threadTitle">Thread</h3>
        <button class="btn" id="closeDrawer">Close</button>
      </div>
      <div id="threadBody" class="stack"></div>
      <div class="replyRow">
        <input type="text" id="threadReplyInput" placeholder="Reply in thread..." />
        <button class="btn primary" id="threadReplyBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------
    // State (mock data)
    // ---------------------------
    const state = {
      activeTab: "home",
      activeChannel: "announcements",
      role: "parent",
      team: { name: "Raptors 10U" },
      members: [
        { id: "m1", name: "Coach Dustin", role: "coach", staffAuthorized: true },
        { id: "m2", name: "Madison (Team Mom)", role: "staff", staffAuthorized: true },
        { id: "m3", name: "Chris (Parent)", role: "parent", staffAuthorized: false },
        { id: "m4", name: "Dessie (Parent)", role: "parent", staffAuthorized: false },
      ],
      events: [
        { id:"e1", type:"Practice", date:"Tue 5:30 PM", location:"Cottonwood Park", title:"Practice — Infield + Bunting", rsvp: { going: 6, maybe: 2, no: 1 }, my:"maybe" },
        { id:"e2", type:"Game", date:"Sat 10:00 AM", location:"Field 3", title:"Raptors vs Rockies", rsvp: { going: 8, maybe: 1, no: 0 }, my:"going" },
      ],
      messages: [
        // Announcements
        {
          id:"a1", channel:"announcements",
          title:"Practice moved to 6:00 PM",
          tag:"Practice",
          body:"Field lights are delayed. Please arrive by 5:50 PM.",
          author:"Coach Dustin",
          pinned:true,
          requireConfirm:true,
          confirmedBy: ["m1","m2"],
          createdAt:"Today 9:12 AM",
          replies: [
            { id:"r1", author:"Chris (Parent)", body:"Got it — thanks!", at:"9:14 AM" }
          ]
        },
        {
          id:"a2", channel:"announcements",
          title:"Tournament schedule posted",
          tag:"Tournament",
          body:"Schedule is in the email too. Saturday: 9AM + 1PM. Sunday depends on seeding.",
          author:"Madison (Team Mom)",
          pinned:false,
          requireConfirm:false,
          confirmedBy: [],
          createdAt:"Yesterday 6:41 PM",
          replies: []
        },
        // General chat
        { id:"g1", channel:"general", body:"Anyone have an extra batting glove? Ours ripped 😭", author:"Dessie (Parent)", createdAt:"Today 8:22 AM", replies: [] },
        { id:"g2", channel:"general", body:"I can bring one! What size?", author:"Chris (Parent)", createdAt:"Today 8:24 AM", replies: [] },
        // Logistics
        { id:"l1", channel:"logistics", body:"Snacks sign-up: who can bring orange slices for Saturday?", author:"Madison (Team Mom)", createdAt:"Yesterday 7:05 PM", replies: [] },
      ],
      thread: { open:false, msgId:null }
    };

    // helpers
    const $ = (sel) => document.querySelector(sel);
    const escapeHtml = (s="") => s.replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));

    function currentUserMember(){
      // map roleSelect to a "current user" identity for demo
      if(state.role === "coach") return state.members.find(m => m.role === "coach");
      if(state.role === "staff") return state.members.find(m => m.role === "staff");
      return state.members.find(m => m.name.startsWith("Chris")) || state.members.find(m => m.role === "parent");
    }

    function canPostInAnnouncements(){
      const me = currentUserMember();
      return me.role === "coach" || (me.role === "staff" && me.staffAuthorized);
    }

    function channelLabel(key){
      return key === "announcements" ? "📣 Announcements" :
             key === "general" ? "💬 Team Chat" :
             "🚗 Logistics";
    }

    function unreadCounts(){
      // lightweight fake unread logic: count announcements that require confirm and user hasn't confirmed
      const me = currentUserMember();
      const pending = state.messages
        .filter(m => m.channel==="announcements" && m.requireConfirm && !m.confirmedBy.includes(me.id)).length;
      return { announcements: pending };
    }

    // ---------------------------
    // Rendering
    // ---------------------------
    function render(){
      $("#teamNamePill").textContent = state.team.name;

      const main = $("#main");
      main.innerHTML = "";

      if(state.activeTab === "home") renderHome(main);
      if(state.activeTab === "schedule") renderSchedule(main);
      if(state.activeTab === "chat") renderChat(main);
      if(state.activeTab === "roster") renderRoster(main);
      if(state.activeTab === "more") renderMore(main);

      renderTabs();
    }

    function renderTabs(){
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.tab === state.activeTab);
      });
      // show unread on Chat tab subtly by updating its label
      const { announcements } = unreadCounts();
      const chatTab = [...document.querySelectorAll(".tab")].find(t => t.dataset.tab === "chat");
      chatTab.innerHTML = `<span class="icon">💬</span>Chat${announcements ? ` <span class="badge">${announcements}</span>` : ""}`;
    }

    function renderHome(main){
      const { announcements } = unreadCounts();
      const nextEvent = state.events[0];
      const pinned = state.messages
        .filter(m => m.channel==="announcements" && m.pinned)
        .sort((a,b) => a.id < b.id ? 1 : -1)[0];

      main.appendChild(elCard(`
        <div class="row between">
          <div>
            <div class="title">Today</div>
            <div class="meta">
              <span class="chip official">Official unread: ${announcements}</span>
              <span class="chip">Role: ${state.role}</span>
            </div>
          </div>
          <button class="btn primary" id="goAnnouncements">View Announcements</button>
        </div>
      `));

      main.appendChild(elCard(`
        <div class="row between">
          <div>
            <div class="title">Next up: ${escapeHtml(nextEvent.type)}</div>
            <div class="meta"><span>${escapeHtml(nextEvent.title)}</span> • <span>${escapeHtml(nextEvent.date)}</span> • <span>${escapeHtml(nextEvent.location)}</span></div>
          </div>
          <button class="btn" id="goSchedule">Open</button>
        </div>
      `));

      if(pinned){
        main.appendChild(elCard(`
          <div class="row between">
            <div>
              <div class="title">
                <span class="chip pin">📌 Pinned</span>
                <span class="chip official">Official</span>
                ${escapeHtml(pinned.title)}
              </div>
              <div class="meta"><span class="chip tag">${escapeHtml(pinned.tag)}</span> <span>by ${escapeHtml(pinned.author)}</span> <span>• ${escapeHtml(pinned.createdAt)}</span></div>
              <div class="divider"></div>
              <div>${escapeHtml(pinned.body)}</div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="row between">
            <div class="tiny muted">${pinned.requireConfirm ? `Confirmations: ${pinned.confirmedBy.length}/${state.members.length}` : "No confirmation required"}</div>
            <button class="btn" data-open-thread="${pinned.id}">Open thread</button>
          </div>
        `));
      }

      $("#goAnnouncements").onclick = () => { state.activeTab="chat"; state.activeChannel="announcements"; render(); };
      $("#goSchedule").onclick = () => { state.activeTab="schedule"; render(); };

      main.querySelectorAll("[data-open-thread]").forEach(btn => {
        btn.onclick = () => openThread(btn.getAttribute("data-open-thread"));
      });
    }

    function renderSchedule(main){
      const wrap = document.createElement("div");
      wrap.className = "stack";

      wrap.appendChild(elCard(`
        <div class="row between">
          <div>
            <div class="title">Schedule</div>
            <div class="muted tiny">RSVP helps coaches plan lineups and carpools.</div>
          </div>
          <span class="chip">Baseball</span>
        </div>
      `));

      const list = document.createElement("div");
      list.className = "list";

      state.events.forEach(ev => {
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <div class="row between">
            <div>
              <div class="title">${escapeHtml(ev.title)}</div>
              <div class="meta">
                <span class="chip tag">${escapeHtml(ev.type)}</span>
                <span>${escapeHtml(ev.date)}</span>
                <span>• ${escapeHtml(ev.location)}</span>
              </div>
              <div class="divider"></div>
              <div class="meta">
                <span>Going: ${ev.rsvp.going}</span>
                <span>Maybe: ${ev.rsvp.maybe}</span>
                <span>No: ${ev.rsvp.no}</span>
              </div>
            </div>
            <span class="chip">My RSVP: ${escapeHtml(ev.my)}</span>
          </div>
          <div class="divider"></div>
          <div class="row">
            <button class="btn good" data-rsvp="${ev.id}|going">Going</button>
            <button class="btn" data-rsvp="${ev.id}|maybe">Maybe</button>
            <button class="btn bad" data-rsvp="${ev.id}|no">No</button>
          </div>
        `;
        list.appendChild(item);
      });

      wrap.appendChild(list);
      main.appendChild(wrap);

      main.querySelectorAll("[data-rsvp]").forEach(btn => {
        btn.onclick = () => {
          const [id, val] = btn.getAttribute("data-rsvp").split("|");
          const ev = state.events.find(e => e.id === id);
          if(!ev) return;

          // naive update counts
          const prev = ev.my;
          if(prev === val) return;

          if(prev === "going") ev.rsvp.going--;
          if(prev === "maybe") ev.rsvp.maybe--;
          if(prev === "no") ev.rsvp.no--;

          if(val === "going") ev.rsvp.going++;
          if(val === "maybe") ev.rsvp.maybe++;
          if(val === "no") ev.rsvp.no++;

          ev.my = val;
          render();
        };
      });
    }

    function renderChat(main){
      const wrap = document.createElement("div");
      wrap.className = "stack";

      const { announcements } = unreadCounts();

      wrap.appendChild(elCard(`
        <div class="row between">
          <div>
            <div class="title">Chat</div>
            <div class="meta">
              <span class="chip official">Announcements unread: ${announcements}</span>
              <span class="chip">Threads keep replies clean</span>
            </div>
          </div>
          <button class="btn" id="scrollLatest">Latest</button>
        </div>
      `));

      // channels
      const chanBar = document.createElement("div");
      chanBar.className = "channels";
      chanBar.innerHTML = `
        <div class="chan ${state.activeChannel==="announcements"?"active":""}" data-chan="announcements">📣 Announcements</div>
        <div class="chan ${state.activeChannel==="general"?"active":""}" data-chan="general">💬 Team Chat</div>
        <div class="chan ${state.activeChannel==="logistics"?"active":""}" data-chan="logistics">🚗 Logistics</div>
      `;
      wrap.appendChild(chanBar);

      // messages list
      const list = document.createElement("div");
      list.className = "list";
      list.id = "messageList";

      const msgs = state.messages
        .filter(m => m.channel === state.activeChannel)
        .slice()
        .sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));

      msgs.forEach(m => list.appendChild(renderMessage(m)));
      wrap.appendChild(list);

      // composer
      wrap.appendChild(renderComposer());

      main.appendChild(wrap);

      // listeners
      wrap.querySelectorAll(".chan").forEach(c => {
        c.onclick = () => { state.activeChannel = c.dataset.chan; render(); };
      });

      $("#scrollLatest").onclick = () => {
        const ml = $("#messageList");
        ml?.lastElementChild?.scrollIntoView({ behavior:"smooth", block:"end" });
      };

      main.querySelectorAll("[data-open-thread]").forEach(btn => {
        btn.onclick = () => openThread(btn.getAttribute("data-open-thread"));
      });

      main.querySelectorAll("[data-confirm]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-confirm");
          const msg = state.messages.find(x => x.id === id);
          const me = currentUserMember();
          if(msg && !msg.confirmedBy.includes(me.id)){
            msg.confirmedBy.push(me.id);
            render();
          }
        };
      });
    }

    function renderMessage(m){
      const item = document.createElement("div");
      item.className = "item";

      const isAnnouncement = m.channel === "announcements";
      const me = currentUserMember();
      const needsConfirm = isAnnouncement && m.requireConfirm;
      const confirmed = needsConfirm ? m.confirmedBy.includes(me.id) : false;

      if(isAnnouncement){
        item.innerHTML = `
          <div class="title">
            ${m.pinned ? `<span class="chip pin">📌 Pinned</span>` : ``}
            <span class="chip official">Official</span>
            ${escapeHtml(m.title || "Announcement")}
          </div>
          <div class="meta">
            <span class="chip tag">${escapeHtml(m.tag || "Update")}</span>
            <span>by ${escapeHtml(m.author)}</span>
            <span>• ${escapeHtml(m.createdAt || "")}</span>
          </div>
          <div class="divider"></div>
          <div>${escapeHtml(m.body || "")}</div>
          <div class="divider"></div>
          <div class="row between">
            <div class="tiny muted">
              ${needsConfirm ? `Confirmations: ${m.confirmedBy.length}/${state.members.length}` : `Replies: ${m.replies?.length || 0}`}
            </div>
            <div class="row" style="gap:8px;">
              ${needsConfirm ? `
                <button class="btn ${confirmed ? "good" : "primary"}" data-confirm="${m.id}" ${confirmed ? "disabled" : ""}>
                  ${confirmed ? "✅ Confirmed" : "✅ Confirm received"}
                </button>
              ` : ``}
              <button class="btn" data-open-thread="${m.id}">Thread (${m.replies?.length || 0})</button>
            </div>
          </div>
        `;
      } else {
        item.innerHTML = `
          <div class="row between">
            <div>
              <div class="title">${escapeHtml(m.author)}</div>
              <div class="meta"><span>${escapeHtml(m.createdAt || "")}</span></div>
            </div>
            <button class="btn" data-open-thread="${m.id}">Reply</button>
          </div>
          <div class="divider"></div>
          <div>${escapeHtml(m.body || "")}</div>
        `;
      }

      return item;
    }

    function renderComposer(){
      const box = document.createElement("div");
      box.className = "card composer";

      const isAnn = state.activeChannel === "announcements";
      const canPost = !isAnn || canPostInAnnouncements();

      const staffHint = isAnn && !canPost
        ? `<div class="muted tiny">Only Coach + Authorized Staff can post official announcements.</div>`
        : `<div class="muted tiny">${isAnn ? "Official post (thread replies only)." : "General conversation."}</div>`;

      const formHtml = isAnn ? `
        <input id="annTitle" type="text" placeholder="Announcement title (required)" />
        <div class="grid2">
          <input id="annTag" type="text" placeholder="Tag (Practice, Game...)" value="Practice" />
          <div class="toggle">
            <span>📌 Pin</span>
            <input id="annPin" type="checkbox" />
          </div>
        </div>
        <div class="toggle">
          <span>✅ Require confirmation</span>
          <input id="annConfirm" type="checkbox" checked />
        </div>
        <textarea id="msgBody" placeholder="Write the official update..."></textarea>
      ` : `
        <textarea id="msgBody" placeholder="Write a message..."></textarea>
      `;

      box.innerHTML = `
        <div class="row between">
          <div>
            <div class="title">New in ${channelLabel(state.activeChannel)}</div>
            ${staffHint}
          </div>
          <button class="btn primary" id="sendBtn" ${canPost ? "" : "disabled"}>Send</button>
        </div>
        ${formHtml}
      `;

      // wire send
      setTimeout(() => {
        const sendBtn = $("#sendBtn");
        sendBtn.onclick = () => {
          const me = currentUserMember();
          const body = ($("#msgBody")?.value || "").trim();
          if(!body) return;

          if(isAnn){
            const title = ($("#annTitle")?.value || "").trim();
            if(!title) { alert("Announcement title is required."); return; }
            const tag = ($("#annTag")?.value || "Update").trim();
            const pinned = !!$("#annPin")?.checked;
            const requireConfirm = !!$("#annConfirm")?.checked;

            const newMsg = {
              id: "a" + Math.floor(Math.random()*1e6),
              channel: "announcements",
              title,
              tag,
              body,
              author: me.name,
              pinned,
              requireConfirm,
              confirmedBy: requireConfirm ? [me.id] : [],
              createdAt: "Just now",
              replies: []
            };
            state.messages.unshift(newMsg);
          } else {
            const newMsg = {
              id: (state.activeChannel[0] + Math.floor(Math.random()*1e6)),
              channel: state.activeChannel,
              body,
              author: me.name,
              createdAt: "Just now",
              replies: []
            };
            state.messages.push(newMsg);
          }

          // reset inputs
          if($("#msgBody")) $("#msgBody").value = "";
          if($("#annTitle")) $("#annTitle").value = "";
          render();
          // jump to latest
          setTimeout(() => $("#messageList")?.lastElementChild?.scrollIntoView({behavior:"smooth"}), 50);
        };
      }, 0);

      return box;
    }

    function renderRoster(main){
      const wrap = document.createElement("div");
      wrap.className = "stack";

      wrap.appendChild(elCard(`
        <div class="row between">
          <div>
            <div class="title">Roster</div>
            <div class="muted tiny">Coach can authorize Staff (team moms) to post official updates.</div>
          </div>
          <span class="chip">Members: ${state.members.length}</span>
        </div>
      `));

      const list = document.createElement("div");
      list.className = "list";

      const me = currentUserMember();
      const isCoach = me.role === "coach";

      state.members.forEach(m => {
        const item = document.createElement("div");
        item.className = "item";

        const roleChip = m.role === "coach" ? `<span class="chip official">Coach</span>`
                       : m.role === "staff" ? `<span class="chip">Staff</span>`
                       : `<span class="chip">Parent</span>`;

        const authChip = (m.role === "staff")
          ? `<span class="chip ${m.staffAuthorized ? "good" : ""}">${m.staffAuthorized ? "✅ Authorized" : "⛔ Not authorized"}</span>`
          : ``;

        item.innerHTML = `
          <div class="row between">
            <div>
              <div class="title">${escapeHtml(m.name)} ${roleChip} ${authChip}</div>
              <div class="meta"><span>ID: ${m.id}</span></div>
            </div>
            ${
              isCoach && m.role === "staff"
              ? `<button class="btn ${m.staffAuthorized ? "" : "primary"}" data-toggle-auth="${m.id}">
                   ${m.staffAuthorized ? "Remove auth" : "Authorize"}
                 </button>`
              : ``
            }
          </div>
        `;
        list.appendChild(item);
      });

      wrap.appendChild(list);
      main.appendChild(wrap);

      main.querySelectorAll("[data-toggle-auth]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-toggle-auth");
          const member = state.members.find(x => x.id === id);
          if(member){
            member.staffAuthorized = !member.staffAuthorized;
            render();
          }
        };
      });
    }

    function renderMore(main){
      const me = currentUserMember();
      const isCoach = me.role === "coach";

      main.appendChild(elCard(`
        <div class="row between">
          <div>
            <div class="title">Settings & Utilities</div>
            <div class="muted tiny">Prototype-only. No backend.</div>
          </div>
          <span class="chip">v0.1</span>
        </div>
        <div class="divider"></div>
        <div class="stack">
          <div class="item">
            <div class="title">Notifications (mock)</div>
            <div class="muted tiny">Announcements are high priority. General chat is muteable.</div>
          </div>

          <div class="item">
            <div class="title">Emergency update (spec)</div>
            <div class="muted tiny">Coach can send a cancellation/location change that auto-pins + requires confirmation.</div>
            <div class="divider"></div>
            <button class="btn ${isCoach ? "primary" : ""}" id="sendEmergency" ${isCoach ? "" : "disabled"}>
              Send emergency update (demo)
            </button>
          </div>

          <div class="item">
            <div class="title">Export schedule (spec)</div>
            <div class="muted tiny">Later: iCal export + calendar sync.</div>
          </div>
        </div>
      `));

      $("#sendEmergency")?.addEventListener("click", () => {
        const me = currentUserMember();
        const em = {
          id:"a" + Math.floor(Math.random()*1e6),
          channel:"announcements",
          title:"🚨 GAME LOCATION CHANGED",
          tag:"Game",
          body:"We’ve been moved to Field 1. Please confirm you saw this.",
          author: me.name,
          pinned:true,
          requireConfirm:true,
          confirmedBy:[me.id],
          createdAt:"Just now",
          replies:[]
        };
        state.messages.unshift(em);
        state.activeTab = "chat";
        state.activeChannel = "announcements";
        render();
      });
    }

    function elCard(html){
      const d = document.createElement("div");
      d.className = "card";
      d.innerHTML = html;
      return d;
    }

    // ---------------------------
    // Thread Drawer
    // ---------------------------
    function openThread(msgId){
      state.thread.open = true;
      state.thread.msgId = msgId;

      const msg = state.messages.find(m => m.id === msgId);
      if(!msg) return;

      $("#threadTitle").textContent =
        (msg.channel === "announcements" ? "📣 " : "💬 ") + (msg.title || "Thread");

      const body = $("#threadBody");
      body.innerHTML = "";

      body.appendChild(elCard(`
        <div class="title">${escapeHtml(msg.title || msg.author)}</div>
        <div class="meta">
          <span class="chip">${channelLabel(msg.channel)}</span>
          <span>by ${escapeHtml(msg.author)}</span>
          <span>• ${escapeHtml(msg.createdAt || "")}</span>
        </div>
        <div class="divider"></div>
        <div>${escapeHtml(msg.body || "")}</div>
      `));

      const repliesWrap = document.createElement("div");
      repliesWrap.className = "list";
      const replies = msg.replies || [];

      if(!replies.length){
        repliesWrap.appendChild(elCard(`<div class="muted tiny">No replies yet. Replies stay in this thread so official updates stay clean.</div>`));
      } else {
        replies.forEach(r => {
          const it = document.createElement("div");
          it.className = "item";
          it.innerHTML = `
            <div class="row between">
              <div>
                <div class="title">${escapeHtml(r.author)}</div>
                <div class="meta"><span>${escapeHtml(r.at || "")}</span></div>
              </div>
            </div>
            <div class="divider"></div>
            <div>${escapeHtml(r.body)}</div>
          `;
          repliesWrap.appendChild(it);
        });
      }

      body.appendChild(repliesWrap);

      $("#drawerBackdrop").classList.add("show");
      $("#threadReplyInput").value = "";
      $("#threadReplyInput").focus();
    }

    function closeThread(){
      state.thread.open = false;
      state.thread.msgId = null;
      $("#drawerBackdrop").classList.remove("show");
    }

    $("#closeDrawer").addEventListener("click", closeThread);
    $("#drawerBackdrop").addEventListener("click", (e) => {
      if(e.target === $("#drawerBackdrop")) closeThread();
    });

    $("#threadReplyBtn").addEventListener("click", () => {
      const msg = state.messages.find(m => m.id === state.thread.msgId);
      if(!msg) return;
      const text = ($("#threadReplyInput").value || "").trim();
      if(!text) return;

      const me = currentUserMember();
      msg.replies = msg.replies || [];
      msg.replies.push({ id:"r"+Math.floor(Math.random()*1e6), author: me.name, body: text, at:"Just now" });
      $("#threadReplyInput").value = "";
      openThread(msg.id); // re-render thread
    });

    $("#threadReplyInput").addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        $("#threadReplyBtn").click();
      }
    });

    // ---------------------------
    // Wiring: tabs + role select
    // ---------------------------
    $("#tabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".tab");
      if(!tab) return;
      state.activeTab = tab.dataset.tab;
      render();
      window.scrollTo({ top:0, behavior:"smooth" });
    });

    $("#roleSelect").addEventListener("change", (e) => {
      state.role = e.target.value;
      render();
    });

    // initial render
    render();
  </script>
</body>
</html>
